[project]
name = "fizzbuzz"
version = "0.1.0"
description = "FizzBuzz as a CLI and a reusable library, with pluggable output adapters (stdout, speech, webhook)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
fizzbuzz = "fizzbuzz.cli:run"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-requests>=2.31",
]

# --- pytest -----------------------------------------------------------------
# Integration tests hit real seams (an in-process HTTP server, an actual TTS
# binary) rather than mocks. They're marked separately so `-m "not
# integration"` gives a fast pure-unit run for local iteration, while CI runs
# everything. This is the test-pyramid split, enforced structurally instead
# of by convention.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises a real external seam (network, subprocess) instead of a mock",
]

[tool.coverage.run]
source = ["src/fizzbuzz"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# --- mypy ---------------------------------------------------------------
# Strict mode. This is a small codebase now; it stays cheap to keep strict
# and gets expensive to bolt on later once untyped code has accreted.
[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- ruff -----------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # flake8-bugbear (common footguns)
    "SIM",           # flake8-simplify
    "N",             # pep8-naming
    "RUF",           # ruff-native checks
]
ignore = [
    "N802",  # do_POST / log_message override stdlib BaseHTTPRequestHandler naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
